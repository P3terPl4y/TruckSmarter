{% extends 'base.html' %}
{% load static %}

{% block title %}Iniciar sesión - TruckSmarter{% endblock %}

{% block content %}
<div class="container login-container">
  <div class="login-card">
    <h2><i class="fas fa-sign-in-alt"></i> Iniciar sesión</h2>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        {{ form.as_p }}
      </div>
      <button type="submit" class="btn-hero" style="width:100%;">
        <i class="fas fa-arrow-right"></i> Iniciar sesión
      </button>
    </form>
    <p class="mt-3 text-center">
      ¿No tienes cuenta? <a href="{% url 'users:register' %}" style="color:var(--color-accent);">Regístrate</a>
    </p>
  </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
  .login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 2rem 0;
  }
  .login-card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 2.5rem;
    max-width: 500px;
    width: 100%;
    box-shadow: var(--shadow-card);
    transition: box-shadow var(--transition);
  }
  .login-card:hover {
    box-shadow: var(--shadow-card-hover);
  }
  .login-card h2 {
    font-weight: 300;
    font-size: 1.8rem;
    text-align: center;
    color: var(--text-primary);
    margin-bottom: 1.5rem;
  }
  .login-card h2 i {
    color: var(--color-accent);
    margin-right: 0.5rem;
  }
  .login-card .form-group {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .login-card .form-group input,
  .login-card .form-group select,
  .login-card .form-group textarea {
    background: var(--bg-body);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 0.6rem 0.8rem;
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 0.95rem;
    width: 100%;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .login-card .form-group input:focus,
  .login-card .form-group select:focus,
  .login-card .form-group textarea:focus {
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(212,168,55,0.15);
    outline: none;
  }
  body.dark-mode .login-card .form-group input,
  body.dark-mode .login-card .form-group select,
  body.dark-mode .login-card .form-group textarea {
    background: var(--bg-card);
  }
  .login-card .form-group label {
    font-weight: 400;
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 0.1rem;
  }
  .login-card .btn-hero {
    width: 100%;
    justify-content: center;
    margin-top: 0.5rem;
  }
  @media (max-width: 480px) {
    .login-card {
      padding: 1.5rem;
    }
  }
</style>
{% endblock %}
