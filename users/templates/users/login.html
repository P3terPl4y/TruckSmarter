{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Iniciar sesión</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </form>
        <p class="mt-3">¿No tienes cuenta? <a href="{% url 'users:register' %}">Regístrate</a></p>
    </div>
</div>
{% endblock %}
