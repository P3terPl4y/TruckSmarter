[tool.black]
line-length = 88
target-version = ['py314']

[tool.coverage.run]
source = ['vehicles', 'users', 'sales', 'dashboard', 'analytics', 'core']
omit = ['*/migrations/*', '*/tests.py', '*/test_*.py', 'core/testing.py']
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
